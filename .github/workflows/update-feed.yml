name: Update word-of-the-day feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-word-of-the-day-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Duden word and update RSS
        run: python feed_updater.py
      - name: Commit and push feed changes
        run: |
          if git diff --quiet -- feed.xml; then
            echo "The feed is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "Update word of the day feed"
          git push
